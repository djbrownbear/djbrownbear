name: Update README cards

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/readme-cards.yml]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GITHUB_TOKEN only reads public data, so no personal token is stored anywhere.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&theme=react
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # main only accepts changes through pull requests, so the cards live on a
      # separate output branch that is replaced on every run (no history build-up).
      - name: Publish cards to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan output
          git add profile/*.svg
          git commit -m "Update README cards"
          git push --force origin output
